<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViaCEP</title>
    <link rel="stylesheet" href="down.css">
    
</head>
<body>
    <main>
        <h1>Consulta CEP</h1>
        <p>Digite um CEP para consultar</p>
        <form action="" id="formulario">
            <label for="CEP"></label>
            <input type="text" id="cep" inputmode="numeric" placeholder="01001-000" maxlength="9" required>
            <button id="botao" type="submit">Buscar endereço</button>
        </form>
        
        <p id="mensagem" role="status"></p>

        <section aria-label="Endereco encontrado">
            <label for="rua">Rua</label>
            <input type="text" id="rua" readonly>
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" readonly>
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" readonly>
            <label for="estado">Estado (UF)</label>
            <input type="text" id="estado" readonly>
        </section>
        <small>O CEP não informa o nome do morador nem o número da casa.</small>
    </main>
    
    <script src="pedroburro.js"></script>
</body>
</html>
